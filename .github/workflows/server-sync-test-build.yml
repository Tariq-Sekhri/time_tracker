name: Server Sync Beta Release

on:
  push:
    branches:
      - server-sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-sync-beta-release
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Set beta build version
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.beta.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.version = "1.11.0-beta.${{ github.run_number }}"
          $config | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: app-beta-latest
          releaseName: Time Tracker v1.11.0 Beta (Latest)
          releaseBody: "Latest Windows beta from the server-sync branch. Beta clients use this prerelease for in-app updates. Stable clients continue using the normal stable release channel."
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: time-tracker_1.11.0-beta-latest_[arch][setup].[ext]
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.beta.conf.json --bundles nsis

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-server-sync-beta-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
