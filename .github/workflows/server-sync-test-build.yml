name: Server Sync Beta Release

on:
  push:
    branches:
      - server-sync

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: app-v__VERSION__-server-sync-beta.${{ github.run_number }}
          releaseName: Time Tracker v__VERSION__ Server Sync Beta ${{ github.run_number }}
          releaseBody: "Windows installer for the server-sync test build. Download the .exe asset below."
          releaseDraft: false
          prerelease: true
          args: --bundles nsis

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-server-sync-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
