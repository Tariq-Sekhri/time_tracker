name: Build Release

on:
  workflow_dispatch:
    inputs:
      beta:
        description: Create a uniquely tagged beta prerelease
        required: true
        type: boolean
        default: true
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  rust-lib-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        continue-on-error: true
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  build:
    needs: rust-lib-tests
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: --bundles deb
            rust_target: ""
          - os: windows-latest
            bundles: --bundles nsis
            rust_target: ""
          - os: macos-latest
            bundles: --target aarch64-apple-darwin --bundles dmg
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            bundles: --target x86_64-apple-darwin --bundles dmg
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        continue-on-error: true
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.beta && format('app-v__VERSION__-beta.{0}', github.run_number) || 'app-v__VERSION__' }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.beta && format('Time Tracker v__VERSION__ Beta {0}', github.run_number) || 'Time Tracker v__VERSION__' }}
          releaseBody: "Installers for Windows (.exe), Linux (.deb), Apple Silicon macOS (.dmg), and Intel macOS (.dmg) are in Assets. macOS beta builds are unsigned, so macOS may require explicit approval before opening them. Ignore .sig and latest.json where present; they are used for automatic updates."
          releaseDraft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.beta }}
          args: ${{ matrix.bundles }}
