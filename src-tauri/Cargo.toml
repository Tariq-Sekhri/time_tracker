[package]
name = "time-tracker"
version = "1.11.0"
description = "A Windows Auto Time Tracking App"
authors = ["Tariq Sekhri"]
edition = "2021"

[lib]
name = "time_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono"
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
anyhow = "1"
tauri-plugin-clipboard-manager = "2.3.2"
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
oauth2 = "5.0.0"
axum = "0.8.9"
url = "2.5"
urlencoding = "2.1"
dotenv = "0.15"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem"
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30.0", features = ["connection", "proxies", "zbus"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "=0.3.1", default-features = false, features = [
    "NSRunningApplication",
    "NSWorkspace"
] }
[features]
dev-warnings = []
